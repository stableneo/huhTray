name: Build & Release DMG

# Adds a "Run workflow" button under the repo's Actions tab.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

# Needed so the workflow can create a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pick the newest Xcode the runner offers. If the project needs a specific
      # Xcode (see README notes on the macOS 26.5 deployment target), pin it here.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Build Release with an ad-hoc signature (no Apple account required).
      # Ad-hoc signing is enough for the app to launch on Apple Silicon.
      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild \
            -project huhTray.xcodeproj \
            -scheme huhTray \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package DMG
        run: |
          APP="build/Build/Products/Release/huhTray.app"
          STAGING="dmg-staging"
          DMG="huhTray-${{ github.event.inputs.version }}.dmg"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "huhTray" -srcfolder "$STAGING" -ov -format UDZO "$DMG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "huhTray ${{ github.event.inputs.version }}"
          files: "huhTray-${{ github.event.inputs.version }}.dmg"
          generate_release_notes: true
